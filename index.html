<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACECHECK - AI-аналіз обличчя</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #ffffff;
      --text: #e0e0e0;
      --text-dim: #a0a0a0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .logo {
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 1.2rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2a2a2a;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      margin: 15px 0 5px 0;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .bar {
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      background: #fff;
    }
    .blur-content {
      filter: blur(5px);
      user-select: none;
      margin: 15px 0;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .btn-pay {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-pay:hover {
      opacity: 0.9;
    }
    .btn-pay:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .lock-icon {
      margin-bottom: 10px;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">FACECHECK</div>
      <button style="background:none; border:1px solid #444; color:#fff; padding:6px 12px; border-radius:6px; font-size:0.8rem;">PRO</button>
    </header>

    <div class="card">
      <div class="metric"><span>АУРА</span><span>89/100</span></div>
      <div class="bar"><div class="fill" style="width: 89%;"></div></div>

      <div class="metric"><span>ВПЕВНЕНІСТЬ</span><span>94/100</span></div>
      <div class="bar"><div class="fill" style="width: 94%;"></div></div>
    </div>

    <div class="card">
      <div class="lock-icon">🔒</div>
      <h3 style="margin: 0 0 10px 0;">ГЛИБОКИЙ AI-АНАЛІЗ ОБЛИЧЧЯ</h3>
      
      <div class="blur-content">
        Ваш психотип показує високу схильність до лідерства. На основі симетрії та пропорцій виявлено приховану рису, яка впливає на ваші рішення в критичних ситуаціях...
      </div>

      <button id="payBtn" class="btn-pay" onclick="handlePayment()">
        РОЗБЛОКУВАТИ ПОВНИЙ ЗВІТ — $1.00 →
      </button>
    </div>
  </div>

  <script>
    async function handlePayment() {
      const payBtn = document.getElementById('payBtn');
      payBtn.disabled = true;
      payBtn.innerText = 'Створення рахунку...';

      try {
        const response = await fetch('/api/create-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: "1.00" })
        });

        const data = await response.json();

        if (data.url) {
          // Перенаправлення на CryptoBot
          window.location.href = data.url;
        } else {
          alert('Помилка створення рахунку: ' + (data.error || 'Спробуйте пізніше'));
          payBtn.disabled = false;
          payBtn.innerText = 'РОЗБЛОКУВАТИ ПОВНИЙ ЗВІТ — $1.00 →';
        }
      } catch (err) {
        console.error('Network Error:', err);
        alert('Помилка з\'єднання. Перевірте підключення.');
        payBtn.disabled = false;
        payBtn.innerText = 'РОЗБЛОКУВАТИ ПОВНИЙ ЗВІТ — $1.00 →';
      }
    }
  </script>

</body>
</html>
