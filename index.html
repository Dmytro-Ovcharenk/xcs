<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Scanner — AI Face Analysis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #111;
    }
    .upload-area {
      border: 2px dashed #d0d0d0;
      border-radius: 14px;
      padding: 24px;
      cursor: pointer;
      margin-bottom: 24px;
      background: #fafafa;
      transition: all 0.2s ease;
      position: relative;
    }
    .upload-area:hover {
      border-color: #000;
      background: #f0f0f0;
    }
    .upload-area img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 10px;
      display: none;
      margin: 0 auto;
    }
    .upload-text {
      font-size: 14px;
      color: #666;
    }
    .metrics {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
      margin-bottom: 24px;
    }
    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #111;
    }
    .progress-bg {
      background: #eaeaea;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      background: #000000;
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn {
      width: 100%;
      padding: 16px;
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled {
      background: #a0a0a0;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      opacity: 0.85;
    }
    .error-msg {
      color: #e53935;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Aura Scanner</h2>

  <div class="upload-area" onclick="document.getElementById('fileInput').click()">
    <span class="upload-text" id="uploadText">Натисніть, щоб завантажити фото обличчя</span>
    <img id="previewImg" alt="Face Preview">
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewFile(event)">
  </div>

  <div class="metrics">
    <div class="metric-item">
      <div class="metric-header"><span>АУРА</span><span id="val-aura">0/100</span></div>
      <div class="progress-bg"><div class="progress-fill" id="bar-aura"></div></div>
    </div>
    <div class="metric-item">
      <div class="metric-header"><span>ВПЕВНЕНІСТЬ</span><span id="val-confidence">0/100</span></div>
      <div class="progress-bg"><div class="progress-fill" id="bar-confidence"></div></div>
    </div>
    <div class="metric-item">
      <div class="metric-header"><span>СТИЛЬ</span><span id="val-style">0/100</span></div>
      <div class="progress-bg"><div class="progress-fill" id="bar-style"></div></div>
    </div>
    <div class="metric-item">
      <div class="metric-header"><span>МІСТЕРІЯ</span><span id="val-mystery">0/100</span></div>
      <div class="progress-bg"><div class="progress-fill" id="bar-mystery"></div></div>
    </div>
    <div class="metric-item">
      <div class="metric-header"><span>ХАОС</span><span id="val-chaos">0/100</span></div>
      <div class="progress-bg"><div class="progress-fill" id="bar-chaos"></div></div>
    </div>
  </div>

  <button class="btn" id="scanBtn" onclick="analyzeFace()" disabled>Проаналізувати обличчя</button>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
  let base64Image = "";

  function previewFile(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result;
        const img = document.getElementById('previewImg');
        img.src = base64Image;
        img.style.display = 'block';
        document.getElementById('uploadText').style.display = 'none';
        document.getElementById('scanBtn').disabled = false;
        document.getElementById('errorMsg').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
  }

  async function analyzeFace() {
    if (!base64Image) return;

    const btn = document.getElementById('scanBtn');
    const errorDiv = document.getElementById('errorMsg');
    
    btn.disabled = true;
    btn.innerText = "ШІ аналізує обличчя...";
    errorDiv.style.display = 'none';

    try {
      const response = await fetch("/api/analyze", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ image: base64Image })
      });

      const scores = await response.json();
      
      if (scores.error) {
        throw new Error(scores.error);
      }

      updateMetric('aura', scores.aura);
      updateMetric('confidence', scores.confidence);
      updateMetric('style', scores.style);
      updateMetric('mystery', scores.mystery);
      updateMetric('chaos', scores.chaos);

    } catch (err) {
      console.error(err);
      errorDiv.innerText = "Помилка аналізу: " + err.message;
      errorDiv.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerText = "Проаналізувати інше фото";
    }
  }

  function updateMetric(key, val) {
    const value = Math.max(10, Math.min(100, val || 50));
    document.getElementById(`val-${key}`).innerText = `${value}/100`;
    document.getElementById(`bar-${key}`).style.width = `${value}%`;
  }
</script>

</body>
</html>
